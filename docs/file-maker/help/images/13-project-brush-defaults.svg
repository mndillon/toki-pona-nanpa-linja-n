<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" role="img" aria-labelledby="title desc">
<title id="title">Project-wide brush defaults</title><desc id="desc">A compact Brush palette shows stroke width nine, smoothing fifty-five percent, and the draw-shapes-from-centre option off. An arrow indicates those preferences are reused when drawing three different glyphs.</desc>
<rect width="960" height="230" rx="14" fill="#fffaf2"/><g font-family="system-ui,sans-serif" fill="#252335">
<rect x="16" y="17" width="333" height="196" rx="12" fill="white" stroke="#b7a3cb"/><text x="32" y="43" font-size="19" font-weight="700">Brush — project defaults</text><text x="32" y="79" font-size="16">Width</text><text x="282" y="79" font-size="16" font-weight="700">9</text><text x="32" y="129" font-size="16">Smooth</text><text x="270" y="129" font-size="16" font-weight="700">55%</text><text x="57" y="184" font-size="15">Draw shapes from centre</text>
<rect x="32" y="166" width="17" height="17" rx="3" fill="white" stroke="#7153a8" stroke-width="2"/>
</g><g stroke="#d7c6e3" stroke-width="8" stroke-linecap="round"><path d="M36 93H310 M36 143H310"/></g><g stroke="#7153ae" stroke-width="8" stroke-linecap="round"><path d="M36 93H61 M36 143H187"/></g><g fill="#7153ae"><circle cx="61" cy="93" r="9"/><circle cx="187" cy="143" r="9"/></g>
<g fill="none" stroke="#7153ae" stroke-width="3"><path d="M365 114H436"/><path d="M426 105l12 9-12 9"/></g><g font-family="system-ui,sans-serif" font-size="17" fill="#3c3151"><text x="452" y="41" font-weight="700">Same active settings when changing glyphs</text></g>
<g fill="white" stroke="#c9b7d7"><rect x="458" y="58" width="145" height="133" rx="10"/><rect x="626" y="58" width="145" height="133" rx="10"/><rect x="795" y="58" width="145" height="133" rx="10"/></g><g stroke="#22202c" stroke-width="9" fill="none" stroke-linecap="round"><path d="M486 158 C500 75 558 76 575 158"/><path d="M660 160V90L742 160V90"/><path d="M824 104L907 156M824 156L907 104"/></g>
<g font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#554766"><text x="531" y="208">Glyph A</text><text x="699" y="208">Glyph B</text><text x="867" y="208">Glyph C</text></g>
</svg>