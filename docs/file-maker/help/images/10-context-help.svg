<svg xmlns="http://www.w3.org/2000/svg" width="850" height="231" viewBox="0 0 850 231" role="img" aria-label="Contextual help question mark within a floating Paths palette">
<title>Contextual help question mark within a floating Paths palette</title><rect width="850" height="231" rx="12" fill="#fffdf8"/><style>text{font-family:system-ui,sans-serif;fill:#2b2635}.muted{fill:#685f6b}.purple{fill:#67449c}.label{font-size:17px;font-weight:700}.hint{font-size:14px}.sub{font-size:12px}.line{stroke:#7651ab;fill:none;stroke-width:4;stroke-linecap:round}.ink{stroke:#282331;fill:none;stroke-width:10;stroke-linecap:round}.guide{stroke:#a7aebf;stroke-width:1;opacity:.4}.major{stroke:#7d869b;stroke-width:1;opacity:.6}</style><text x="20" y="28" class="label" >Floating palette help opens the matching guide section</text><rect x="100" y="50" width="480" height="152" rx="12" fill="#fff8ed" stroke="#c7b7a3"/><rect x="100" y="50" width="480" height="48" rx="12" fill="#eee5fb"/><text x="127" y="81" class="label" >⠿ Paths</text><rect x="417" y="56" width="49" height="38" rx="8" fill="#ede4fb" stroke="#7651ab"/><text x="429" y="81" class="label" >?</text><rect x="478" y="56" width="86" height="38" rx="8" fill="#fff8ec" stroke="#c9b9a0"/><text x="490" y="81" class="label" >× Hide</text><text x="124" y="132" class="hint" >Edit nodes  ▸</text><text x="124" y="159" class="hint" >Combine shapes  ▸</text><text x="124" y="186" class="hint" >Inspect &amp; repair outlines  ▸</text><path d="M442 52 L442 24 L641 24" stroke="#7651ab" stroke-width="2.5" fill="none"/><text x="652" y="28" class="hint" >Help → Paths section</text></svg>