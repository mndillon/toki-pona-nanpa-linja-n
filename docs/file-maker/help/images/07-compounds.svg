<svg xmlns="http://www.w3.org/2000/svg" width="850" height="207" viewBox="0 0 850 207" role="img" aria-label="Compound editor selectors and transformed component preview">
<title>Compound editor selectors and transformed component preview</title><rect width="850" height="207" rx="12" fill="#fffdf8"/><style>text{font-family:system-ui,sans-serif;fill:#2b2635}.muted{fill:#685f6b}.purple{fill:#67449c}.label{font-size:17px;font-weight:700}.hint{font-size:14px}.sub{font-size:12px}.line{stroke:#7651ab;fill:none;stroke-width:4;stroke-linecap:round}.ink{stroke:#282331;fill:none;stroke-width:10;stroke-linecap:round}.guide{stroke:#a7aebf;stroke-width:1;opacity:.4}.major{stroke:#7d869b;stroke-width:1;opacity:.6}</style><text x="22" y="26" class="label" >Compounds: choose two source glyphs and a relation</text><rect x="20" y="50" width="135" height="38" rx="8" fill="#fff8ec" stroke="#c9b9a0"/><text x="32" y="75" class="label" >First glyph</text><rect x="178" y="50" width="116" height="38" rx="8" fill="#fff8ec" stroke="#c9b9a0"/><text x="190" y="75" class="label" >&amp; / − / +</text><rect x="317" y="50" width="162" height="38" rx="8" fill="#fff8ec" stroke="#c9b9a0"/><text x="329" y="75" class="label" >Second glyph</text><rect x="506" y="49" width="313" height="135" rx="9" fill="white" stroke="#d5c4dd"/><path d="M568 138 C579 91 637 80 655 138" class="ink"/><path d="M652 118 C671 80 720 86 738 128" class="line"/><text x="517" y="171" class="hint" >Move / scale / rotate each component</text></svg>